[project]
name = "codemycar-server"
version = "2.0.0"
description = "CodeMyCar 小车控制服务端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "webrtcvad-wheels>=2.0.14",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "paho-mqtt>=2.0.0",
    "structlog>=25.1.0",
    "python-dotenv>=1.0.0",
    "langchain[mcp]>=1.4.10,<1.5",
    "langchain-deepseek>=1.1.1,<1.2",
    "langchain-openai>=1.1,<2",
    "numpy>=1.26,<3",
    "soxr>=0.5,<1",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "aiosqlite>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.15.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
